server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep automatic redirects (for example /api -> /api/) relative so they
    # preserve the externally published port (8080 locally, 80 in Azure).
    absolute_redirect off;

    # The browser only reaches the frontend origin. Nginx forwards API calls
    # through the private Compose network, avoiding development-only CORS.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        # Preserve the client-facing host and port. Without the port, NestJS
        # redirects /api to http://host/api/ and bypasses the published port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
