#cloud-config
# AWS creates the ubuntu user and installs the EC2 key pair before cloud-init.
# Do not redeclare the user here: doing so can overwrite the authorized keys.
package_update: true
packages:
  - python3
  - python3-apt
  - ca-certificates
ssh_pwauth: false
runcmd:
  - systemctl enable ssh
  - systemctl start ssh
