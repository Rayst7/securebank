appId: host.exp.exponent
name: TC-MOB-14 - Opciones adicionales
---
- stopApp
- openLink: ${EXPO_URL}

- runFlow:
    when:
      visible:
        id: login-submit
    file: _autenticar-qa.yaml

- extendedWaitUntil:
    visible: "^M.s$"
    timeout: 45000

- tapOn: "^M.s$"

- extendedWaitUntil:
    visible: ".*Sesi.n activa.*"
    timeout: 30000

- takeScreenshot: TC-MOB-14-pantalla
