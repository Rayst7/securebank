appId: host.exp.exponent
name: TC-MOB-15-v2 - Visualizacion de cuentas bancarias
---
- extendedWaitUntil:
    visible: "^(Inicio|Inicia sesi.n)$"
    timeout: 60000

- runFlow:
    when:
      visible:
        id: login-submit
    file: _autenticar-qa.yaml

- extendedWaitUntil:
    visible: "^Inicio$"
    timeout: 45000

- tapOn: "^Inicio$"

- extendedWaitUntil:
    visible: "Mis cuentas"
    timeout: 30000

- scrollUntilVisible:
    element: "Ver movimientos.*"
    direction: DOWN
    timeout: 25000

- assertVisible: "Ver movimientos.*"

- takeScreenshot: TC-MOB-15-v2-cuentas
