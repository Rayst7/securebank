appId: host.exp.exponent
name: TC-MOB-12 - Modulo de transferencias
---
- stopApp
- openLink: ${EXPO_URL}

- runFlow:
    when:
      visible:
        id: login-submit
    file: _autenticar-qa.yaml

- extendedWaitUntil:
    visible: "^M.s$"
    timeout: 45000

- tapOn: "^Transferir$"

- extendedWaitUntil:
    visible: ".*Nueva transferencia.*"
    timeout: 30000

- takeScreenshot: TC-MOB-12-pantalla
