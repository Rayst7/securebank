appId: host.exp.exponent
name: TC-MOB-13 - Modulo de pagos
---
- stopApp
- openLink: ${EXPO_URL}

- runFlow:
    when:
      visible:
        id: login-submit
    file: _autenticar-qa.yaml

- extendedWaitUntil:
    visible: "^M.s$"
    timeout: 45000

- tapOn: "^Pagos$"

- extendedWaitUntil:
    visible: ".*Nuevo pago.*"
    timeout: 30000

- takeScreenshot: TC-MOB-13-pantalla
