---
- name: Instalar dependencias para el repositorio Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      # Needed by the Jenkins release synchronization step.
      - rsync
    state: present
    update_cache: true

- name: Crear directorio de llaves APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Descargar llave oficial de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Configurar repositorio oficial Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Instalar Docker Engine y Docker Compose v2
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Configurar rotación de logs del daemon Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
  notify: Reiniciar Docker

- name: Habilitar Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Autorizar al usuario de despliegue a usar Docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
